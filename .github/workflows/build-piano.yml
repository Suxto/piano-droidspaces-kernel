name: Build piano kernel

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: Optional piano source commit; blank uses branch head
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Check out builder
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            dwarves flex gcc-aarch64-linux-gnu git kmod libelf-dev \
            libncurses-dev libssl-dev lz4 openssl python3 python3-pip \
            rsync unzip xz-utils zstd

      - name: Build piano kernel suite
        env:
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
        run: |
          chmod +x build.sh build-action.sh
          ./build-action.sh

      - name: Upload kernel suite
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            .build/${{ env.ARTIFACT_NAME }}.tar.gz
            .build/manifest.txt
            .build/piano-kernel.config
            .build/piano-System.map
            .build/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
